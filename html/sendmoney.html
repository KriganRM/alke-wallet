<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet - Enviar dinero</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-primary navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="menu.html">
                Alke Wallet
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="sendmoney.html">
                            Enviar dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Enviar dinero
                        </h2>

                        <!-- Saldo -->
                        <div class="text-center mb-4">

                            <small class="text-muted">
                                Saldo disponible
                            </small>

                            <h3 id="saldoActual">
                                $100.000
                            </h3>

                        </div>

                        <button type="button" class="btn btn-outline-primary w-100 mb-3" data-bs-toggle="modal"
                            data-bs-target="#contactModal">
                            Agregar nuevo contacto
                        </button>

                        <form id="sendMoneyForm">

                            <!-- Contacto -->

                            <div class="mb-3">

                                <label for="contacto" class="form-label">
                                    Buscar contacto
                                </label>

                                <input type="text" class="form-control" id="contacto"
                                    placeholder="Selecciona o busca un contacto" autocomplete="off" required>

                            </div>




                            <!-- Monto -->
                            <div class="mb-3">

                                <label for="monto" class="form-label">
                                    Monto a enviar
                                </label>

                                <input type="text" class="form-control" id="monto" placeholder="$0" inputmode="numeric"
                                    required>

                            </div>


                            <button type="submit" class="btn btn-primary w-100">
                                Enviar dinero
                            </button>

                        </form>


                        <div id="mensaje" class="mt-3"></div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Modal nuevo contacto -->
    <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Agregar contacto
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <form id="contactForm">

                        <div class="mb-3">

                            <label for="nombreContacto" class="form-label">
                                Nombre
                            </label>

                            <input type="text" class="form-control" id="nombreContacto" required>

                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Guardar contacto
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

    <!-- JavaScript propio -->
    <script src="/js/sendmoney.js"></script>

</body>

</html>
