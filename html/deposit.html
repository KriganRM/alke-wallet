<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet - Depósito</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-primary navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="menu.html">
                Alke Wallet
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">
                            Enviar dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Realizar depósito
                        </h2>

                        <p class="text-center text-muted">
                            Ingresa el monto que deseas agregar a tu cuenta.
                        </p>

                        <div class="mb-4 text-center">

                            <small class="text-muted">
                                Saldo actual
                            </small>

                            <h3 id="saldoActual">
                                $100.000
                            </h3>

                        </div>


                        <form id="depositForm">

                            <div class="mb-3">

                                <label for="monto" class="form-label">
                                    Monto a depositar
                                </label>

                                <input type="text" class="form-control" id="monto" placeholder="Ej: $20.000" required>

                            </div>


                            <button type="submit" class="btn btn-primary w-100">
                                Realizar depósito
                            </button>

                        </form>

                        <div id="mensaje" class="mt-3"></div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript propio -->
    <script src="/js/deposit.js"></script>

</body>

</html>
